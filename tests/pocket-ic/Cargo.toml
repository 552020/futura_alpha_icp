[package]
name = "pocket-ic-tests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backend_pocket_ic"
path = "backend_pocket_ic.rs"

[[bin]]
name = "memories_pocket_ic"
path = "memories_pocket_ic.rs"

[[bin]]
name = "top_up_pocket_ic"
path = "top_up_pocket_ic.rs"

[dependencies]
pocket-ic = "10.0"
candid = "0.10.0"
ic-cdk = "0.18.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
backend = { path = "../../src/backend" }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
